name: Woechentliche Bestandsliste

on:
  schedule:
    # Montags 10:00 UTC = 12:00 Uhr deutscher Sommerzeit.
    # Achtung: GitHub rechnet in UTC ohne Zeitumstellung. Ab Ende Oktober
    # entspricht dieser Eintrag 11:00 Uhr deutscher Zeit; fuer punktgenau
    # 12 Uhr muesste er dann auf "0 11 * * 1" geaendert werden.
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  bestandsliste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install openpyxl

      - name: Bestandsliste erzeugen und versenden
        env:
          MAIL_ABSENDER: ${{ secrets.MAIL_ABSENDER }}
          MAIL_PASSWORT: ${{ secrets.MAIL_PASSWORT }}
          # Die Empfaenger stehen in data/einstellungen.csv. Diese Variable
          # wird nur ausgewertet, wenn dort nichts hinterlegt ist.
          BESTANDSLISTE_EMPFAENGER: ${{ secrets.BESTANDSLISTE_EMPFAENGER }}
        run: python inventur.py bericht --mail

      - name: Bericht als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: bestandsliste
          path: berichte/*.xlsx
